version: "3.7"

services:
  app_proxy:
    environment:
      # Umbrel injects the container name as <app-id>_<service>_1.
      # On umbrelOS 2.0 this service is routing config and is not started as a container.
      APP_HOST: heilss-heilss_web_1
      APP_PORT: 8480

  web:
    image: ghcr.io/jborgwardt/heil-store-studio:1.0.0@sha256:2c6af2fe601c988b93952535dd094e2e47cacda2604ab3c92a5a51015421a0a5
    user: "1000:1000"
    restart: on-failure
    init: true
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
