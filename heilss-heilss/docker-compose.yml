version: "3.7"

services:
  app_proxy:
    environment:
      # Umbrel injects the container name as <app-id>_<service>_1.
      # On umbrelOS 2.0 this service is routing config and is not started as a container.
      APP_HOST: heilss-heilss_web_1
      APP_PORT: 8480

  web:
    image: ghcr.io/jborgwardt/heil-store-studio:1.0.0@sha256:6ecb6256075c6b7983f12629c3f26e309322783ce37e05551ba69123cc7b1c41
    user: "1000:1000"
    restart: on-failure
    init: true
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
