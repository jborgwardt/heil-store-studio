manifestVersion: 1
id: heilss-heilss
storage:
  dataRoot: data
category: developer
name: HeilSS
version: "1.0.0"
tagline: Build and manage a community app store
icon: "data:image/svg+xml;base64,"
description: >-
  HeilSS creates an umbrelOS community app store. Paste a Docker Compose file,
  a docker run command, a GitHub repository, or an image name. It writes a
  valid app entry, commits it, and serves the store over git so Umbrel can
  install those apps.

  HeilSS itself is not one of the apps in the store it manages. Open it from
  your Umbrel desktop, then add the store URL it shows under Community App Stores.
