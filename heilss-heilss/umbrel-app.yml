manifestVersion: 1
id: heilss-heilss
storage:
  dataRoot: data
category: developer
name: HeilSS
version: "1.1.0"
tagline: Build and manage a community app store
icon: https://raw.githubusercontent.com/jborgwardt/heil-store-studio/main/images/icons/heilss.png
description: >-
  HeilSS creates an umbrelOS community app store. Paste a Docker Compose file,
  a docker run command, a GitHub repository, or an image name. It writes a
  valid app entry, commits it, and serves the store over git so Umbrel can
  install those apps.

  HeilSS itself is not one of the apps in the store it manages. Open it from
  your Umbrel desktop, then add the store URL it shows under Community App Stores.
releaseNotes: >-
  Linked stores: HeilSS now shows the community stores your Umbrel already loads
  (GitHub, Gitea) next to its own, with a store switcher and search. Every app has a
  Change icon panel (upload SVG/PNG/WebP/GIF/JPEG, fetch from the repo, or a monogram)
  and an Edit files editor; changes are committed and pushed back. Editing keeps the
  current icon. Fixed icon links that returned 404.
