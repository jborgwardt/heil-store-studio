version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: heilss-altmount_server_1
      APP_PORT: 8080
  server:
    image: ghcr.io/javi11/altmount:latest
    restart: on-failure
    environment:
    - PUID=1000
    - PGID=1000
    - PORT=8080
    - HOST=0.0.0.0
    - TZ=America/New_York
    - JWT_SECRET=${APP_ALTMOUNT_JWT_SECRET}
    devices:
    - /dev/fuse:/dev/fuse
    cap_add:
    - SYS_ADMIN
    security_opt:
    - apparmor:unconfined
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/metadata:/metadata
    - ${APP_DATA_DIR}/data/mnt:/mnt/altmount:rshared
