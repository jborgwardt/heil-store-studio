version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: heilss-mosquitto_web_1
      APP_PORT: 80
  broker:
    image: eclipse-mosquitto:2
    restart: on-failure
    user: 1000:1000
    ports:
    - 1883:1883
    - 9001:9001
    volumes:
    - ${APP_DATA_DIR}/data/config:/mosquitto/config
    - ${APP_DATA_DIR}/data/data:/mosquitto/data
    - ${APP_DATA_DIR}/data/log:/mosquitto/log
  web:
    image: nginx:1.27-alpine
    restart: on-failure
    command:
    - /bin/sh
    - -c
    - echo '<h1>Mosquitto</h1><p>MQTT on port 1883, websockets on 9001.</p>' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
