version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: heilss-guacamole_web_1
      APP_PORT: 8080
  initdb:
    image: guacamole/guacamole:1.6.0
    user: root
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -c
    - test -s /init/initdb.sql || /opt/guacamole/bin/initdb.sh --postgresql > /init/initdb.sql
    volumes:
    - ${APP_DATA_DIR}/data/init:/init
  db:
    image: postgres:16-alpine
    restart: on-failure
    depends_on:
      initdb:
        condition: service_completed_successfully
    environment:
    - POSTGRES_DB=guacamole_db
    - POSTGRES_USER=guacamole
    - POSTGRES_PASSWORD=${APP_GUACAMOLE_DB_PASSWORD}
    volumes:
    - ${APP_DATA_DIR}/data/pgdata:/var/lib/postgresql/data
    - ${APP_DATA_DIR}/data/init:/docker-entrypoint-initdb.d:ro
  guacd:
    image: guacamole/guacd:1.6.0
    restart: on-failure
  web:
    image: guacamole/guacamole:1.6.0
    restart: on-failure
    depends_on:
    - db
    - guacd
    environment:
    - GUACD_HOSTNAME=heilss-guacamole_guacd_1
    - POSTGRESQL_HOSTNAME=heilss-guacamole_db_1
    - POSTGRESQL_DATABASE=guacamole_db
    - POSTGRESQL_USERNAME=guacamole
    - POSTGRESQL_PASSWORD=${APP_GUACAMOLE_DB_PASSWORD}
    - WEBAPP_CONTEXT=ROOT
    - REMOTE_IP_VALVE_ENABLED=true
