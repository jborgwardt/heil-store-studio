{
  "services": {
    "app_proxy": {
      "environment": {
        "APP_HOST": "heilss-litecoin_dashboard_1",
        "APP_PORT": "8080"
      }
    },
    "node": {
      "image": "litecoinproject/litecoin-core:0.21.5.8@sha256:49e3a8a41631fd7d15184014bdb5db3971faada9a00e73ad38593a60871e5067",
      "restart": "unless-stopped",
      "stop_grace_period": "2m",
      "command": [
        "-printtoconsole",
        "-server=1",
        "-disablewallet=1",
        "-rpcbind=0.0.0.0",
        "-rpcallowip=0.0.0.0/0",
        "-rpcport=9332",
        "-dbcache=450",
        "-maxconnections=32",
        "-upnp=0",
        "-txindex=1",
        "-rpcserialversion=1"
      ],
      "volumes": [
        "${APP_DATA_DIR}/data/chain:/home/litecoin/.litecoin"
      ],
      "ports": [
        "9333:9333"
      ],
      "networks": [
        "rpc"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "litecoin-cli",
          "-datadir=/home/litecoin/.litecoin",
          "getblockchaininfo"
        ],
        "interval": "30s",
        "timeout": "10s",
        "retries": 5,
        "start_period": "120s"
      }
    },
    "dashboard": {
      "image": "python:3.13-alpine",
      "restart": "unless-stopped",
      "command": [
        "python",
        "/app/dashboard.py"
      ],
      "volumes": [
        "${APP_DATA_DIR}/dashboard.py:/app/dashboard.py:ro",
        "${APP_DATA_DIR}/icon.png:/app/icon.png:ro",
        "${APP_DATA_DIR}/data/chain:/chain:ro"
      ],
      "depends_on": [
        "node"
      ],
      "networks": [
        "default",
        "rpc"
      ],
      "read_only": true,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "cap_add": [
        "DAC_READ_SEARCH"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/status',timeout=15).read()"
        ],
        "interval": "30s",
        "timeout": "20s",
        "retries": 5,
        "start_period": "120s"
      }
    },
    "electrum": {
      "image": "cculianu/fulcrum:v2.1.4@sha256:3de5dc10d6fd331a61adf54bc238bc01d1fc9618f2f763e2454e21b4e6d888b1",
      "entrypoint": [
        "/usr/bin/Fulcrum"
      ],
      "command": [
        "/app/fulcrum.conf"
      ],
      "restart": "unless-stopped",
      "stop_grace_period": "2m",
      "volumes": [
        "${APP_DATA_DIR}/fulcrum-settings.conf:/app/fulcrum.conf:ro",
        "${APP_DATA_DIR}/data/electrum:/data",
        "${APP_DATA_DIR}/data/chain:/chain:ro"
      ],
      "networks": [
        "rpc"
      ],
      "ports": [
        "50001:50001"
      ],
      "depends_on": [
        "node"
      ],
      "mem_limit": "1800m",
      "cpus": 2,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/stats',timeout=10).read()"
        ],
        "interval": "30s",
        "timeout": "15s",
        "retries": 5,
        "start_period": "120s"
      }
    }
  },
  "networks": {
    "rpc": {}
  }
}
