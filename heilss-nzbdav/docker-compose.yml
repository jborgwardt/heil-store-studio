version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: heilss-nzbdav_server_1
      APP_PORT: 3000
  server:
    image: nzbdav/nzbdav:alpha
    restart: on-failure
    environment:
    - TZ=America/New_York
    - PUID=1000
    - PGID=1000
    - LOG_LEVEL=warning
    volumes:
    - ${APP_DATA_DIR}/data/config:/config
