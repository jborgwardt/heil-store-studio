manifestVersion: 1
id: heilss-feather
category: finance
name: Feather Wallet
version: "2.9.1"
tagline: Monero desktop wallet connected to your node
icon: data:image/png;base64,
description: >-
  The official Feather desktop wallet, displayed in your browser through noVNC.
  This is unofficial Heil store packaging, not an official Feather or Umbrel integration.
  The upstream release is verified with Feather's signing key and SHA-256 hash.
  Your Umbrel Monero node is preconfigured. Wallets and settings persist in app data.
  Open the app to create or restore your wallet yourself, and keep a secure backup of your seed.
  Anyone with access to this desktop can interact with the wallet; use a wallet password.
  Removing this app deletes its wallet data. Back up your wallet first.
developer: Feather Wallet contributors
website: https://featherwallet.org
dependencies:
  - monero
repo: https://github.com/feather-wallet/feather
support: https://github.com/jborgwardt/heil-store-studio/issues
port: 8096
gallery: []
path: /vnc.html?autoconnect=true&resize=scale
releaseNotes: Initial Heil store package of Feather 2.9.1 with verified upstream binary, persistent storage, official icon, and local Monero node settings.
submitter: Heil Store
submission: https://github.com/jborgwardt/heil-store-studio
