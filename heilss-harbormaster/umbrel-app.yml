manifestVersion: 1
id: heilss-harbormaster
category: developer
name: Harbormaster
version: "0.1.0"
icon: https://raw.githubusercontent.com/jborgwardt/heil-store-studio/main/images/icons/harbormaster.png
tagline: Manage secrets, settings and ports of every installed app
description: >-
  Dashboard of every installed app with status, host ports and settings. Edit secrets and
  environment variables in a form; they are saved through umbrelOS's own app settings (so they
  survive app updates) and the app restarts. Add extra host ports with conflict warnings.
  Every change is committed to a private repo on your self-hosted Gitea (apps/<app-id>/secret.env
  + settings.json) and restored automatically after a reinstall or on a new Umbrel.
  Setup: install Gitea, create a private repo and token, and create an umbrelOS MCP token
  (Settings) with access to all apps; paste them in the Setup tab.
developer: Justin
website: https://github.com/jborgwardt/harbormaster
