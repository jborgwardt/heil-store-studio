name: Harbormaster
version: "0.2.1"
icon: https://raw.githubusercontent.com/jborgwardt/heil-store-studio/main/images/icons/harbormaster.png
tagline: Manage secrets, settings and ports of every installed app
description: >-
  Arcane/Portainer-style manager for umbrelOS. One dashboard with every installed app: state,
  version, containers, host ports, environment and logs, plus a port-conflict view. Apps from your
  private Gitea app store can be edited in a form (ports, env, any compose value); saving commits to
  the store repo, bumps the version and umbrelOS applies the update. Other apps are read-only and can
  be adopted into the private store.
