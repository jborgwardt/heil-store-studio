name: image
on:
  push:
    branches: [main]
    paths: ['src/**', 'Dockerfile', 'package*.json', 'docker-entrypoint.sh', '.github/workflows/image.yml']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source bundle
        run: |
          set -e
          changed=0
          if [ -f src-bundle.tgz.b64 ]; then
            base64 -d src-bundle.tgz.b64 | tar xz; git rm -q src-bundle.tgz.b64; git add -A; changed=1
          fi
          if [ "$changed" = 1 ]; then
            git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
            git commit -m "Restore binary assets" && git push
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: b
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/jborgwardt/heil-store-studio:1.0.0
          labels: org.opencontainers.image.source=https://github.com/jborgwardt/heil-store-studio
      - run: echo "DIGEST=${{ steps.b.outputs.digest }}" | tee -a $GITHUB_STEP_SUMMARY
