name: feather-image
on:
  push:
    branches: [main]
    paths: ['containers/feather/**', '.github/workflows/feather-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: containers/feather
          push: true
          provenance: false
          tags: ghcr.io/jborgwardt/heil-store-studio:feather-2.9.1-1
          labels: org.opencontainers.image.source=https://github.com/jborgwardt/heil-store-studio
      - run: echo '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
